<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense - Smart Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>Edit Expense</h1>
            <p>Update your expense details</p>
        </header>


        <section class="form-section">

            <h2>Edit Expense Details</h2>

            <form
                action="/edit/{{ expense['id'] }}"
                method="POST"
            >

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0"
                        value="{{ expense['amount'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option
                            value="Food"
                            {% if expense['category'] == 'Food' %}selected{% endif %}
                        >
                            Food
                        </option>

                        <option
                            value="Travel"
                            {% if expense['category'] == 'Travel' %}selected{% endif %}
                        >
                            Travel
                        </option>

                        <option
                            value="Shopping"
                            {% if expense['category'] == 'Shopping' %}selected{% endif %}
                        >
                            Shopping
                        </option>

                        <option
                            value="Bills"
                            {% if expense['category'] == 'Bills' %}selected{% endif %}
                        >
                            Bills
                        </option>

                        <option
                            value="Education"
                            {% if expense['category'] == 'Education' %}selected{% endif %}
                        >
                            Education
                        </option>

                        <option
                            value="Entertainment"
                            {% if expense['category'] == 'Entertainment' %}selected{% endif %}
                        >
                            Entertainment
                        </option>

                        <option
                            value="Healthcare"
                            {% if expense['category'] == 'Healthcare' %}selected{% endif %}
                        >
                            Healthcare
                        </option>

                        <option
                            value="Other"
                            {% if expense['category'] == 'Other' %}selected{% endif %}
                        >
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        value="{{ expense['description'] }}"
                        placeholder="What did you spend on?"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        value="{{ expense['date'] }}"
                        required
                    >

                </div>


                <button type="submit">
                    Update Expense
                </button>

            </form>


            <div class="filter-actions">

                <a href="/" class="reset-button">
                    Back to Dashboard
                </a>

            </div>

        </section>

    </div>

</body>

</html>
